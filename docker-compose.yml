services:
  redpits-web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redpits-ai
  redpits-ai:
    build:
      context: .
      dockerfile: ai_engine/Dockerfile
    env_file: .env.ai
    ports:
      - "8100:8100"
    volumes:
      - ./ai-models:/app/models
      - ./ai-output:/app/outputs
    gpus: all
