<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08070a"><title>RedPits — Login</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="ambient"></div><header class="topbar"><a class="brand" href="/"><span class="mark">R</span><span>Red<span>Pits</span></span></a></header><main class="auth-page"><section class="auth-card glass"><div class="overline">REDPITS ACCOUNT</div><h1 id="auth-title">Welcome back</h1><p id="auth-subtitle">Log in to continue creating.</p><div class="auth-tabs"><button id="login-tab" class="auth-tab active">Log in</button><button id="signup-tab" class="auth-tab">Create account</button></div><form id="auth-form"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"></label><label id="confirm-wrap" class="hidden">Confirm password<input id="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your password"></label><button class="primary" type="submit" id="submit">Log in</button><p id="auth-message" class="auth-message"></p></form><a class="back-link" href="/">← Back to RedPits</a></section></main><script src="/static/auth.js"></script></body></html>
